name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Package Chromium extension
        run: cd dist/chromium && zip -r ../../modal-navigator-chromium-${{ github.ref_name }}.zip .

      - name: Package Firefox extension
        run: cd dist/firefox && zip -r ../../modal-navigator-firefox-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            modal-navigator-chromium-${{ github.ref_name }}.zip
            modal-navigator-firefox-${{ github.ref_name }}.zip
